# StoreAutopilot settings. Non-secret values only.
# Keys live outside the repo in ~/.storeautopilot/{{app_id}}/ (asc_key.p8, asc_key.json, play.json).
app_id: {{app_id}}
flutter_project: {{flutter_project}}

# Locale ids used in store.md → each store's language code.
locales:
{{locales}}

# Screenshot ids in store order; the integration test calls takeStoreScreenshot(tester, '<id>') for each.
screenshots: [01_home]

brand:
  background: "{{background}}"
  text: "#FFFFFF"
  accent: "#F59E0B"
  font: -apple-system, Helvetica Neue, Arial, sans-serif

ios:
  bundle_id: {{bundle_id}}
  # ipad: false               # default: follow the Xcode project
  # phased_release: true      # after approval, release to users over 7 days
  # testflight_notes: true    # release_notes become TestFlight's "What to Test" (waits a few minutes for the build)
{{encryption_line}}

android:
  package: {{package}}
  track: internal
  release_status: completed   # "draft" while Play still treats the app as a draft
  # emulator: Pixel_8         # AVD name; default: the first one
  # keystore_properties: ~/Keys/{{app_id}}/key.properties
  # rollout: 20               # submit starts production with 20% of users; widen with `storeautopilot rollout 50`
  # halt_crash_rate: 1.09     # `rollout watch` halts a staged rollout above this crash rate (percent)

# Optional features, all off. Turn on what you want; `storeautopilot doctor` lists them.
features:
  store_check: false          # check both stores before building (version already live, missing app record)
  store_requirements: false   # stop when a store rule in force isn't met (target SDK, Xcode, minimum iOS)
  review_risks: false         # stop on certain App Review problems (missing AdMob id, tracking prompt)
  text_advice: false          # point out wasted keyword characters, long captions, example URLs
  privacy_check: false        # doctor compares store.md's privacy declaration with your packages
  submit_check: false         # check everything App Review needs before submit
  reuse_screenshots: false    # skip capturing when the app hasn't changed since the last capture
  resume: false               # a re-run of the same commit skips builds already uploaded
  retries: false              # retry store checks and listing updates after a passing API error
  job_summary: false          # write a summary on the GitHub Actions run page
  rollout_guard: false        # check Play vitals before widening a staged rollout; `rollout watch` halts a bad one
  data_safety_upload: false   # upload storeautopilot/data_safety.csv to Google Play when it changes
  api_upload: false           # upload iOS builds through the App Store Connect API (instead of Apple's upload tool)
