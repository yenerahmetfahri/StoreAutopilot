<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- StoreAutopilot Play feature graphic (1024x500). Placeholders: name, tagline, background, text, accent, font, width, height -->
<style>
  html, body { margin: 0; width: {{width}}px; height: {{height}}px; overflow: hidden; }
  body {
    box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; padding: 0 80px;
    background: {{background}}; font-family: {{font}}; border-bottom: 14px solid {{accent}};
  }
  h1 { margin: 0; color: {{text}}; font-size: 84px; font-weight: 800; line-height: 1.05; }
  p { margin: 22px 0 0; color: {{accent}}; font-size: 36px; font-weight: 600; }
</style>
</head>
<body>
  <h1>{{name}}</h1>
  <p>{{tagline}}</p>
</body>
</html>
