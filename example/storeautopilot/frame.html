<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- StoreAutopilot screenshot frame. Placeholders: caption, screenshot, background, text, accent, font, width, height, platform -->
<style>
  html, body { margin: 0; width: {{width}}px; height: {{height}}px; overflow: hidden; }
  body {
    box-sizing: border-box; display: flex; flex-direction: column; align-items: center;
    padding: calc({{height}}px * 0.055) calc({{width}}px * 0.08) 0;
    background: {{background}}; font-family: {{font}};
  }
  h1 {
    margin: 0 0 calc({{height}}px * 0.035); color: {{text}}; text-align: center;
    font-size: min(calc({{width}}px * 0.072), calc({{height}}px * 0.034)); line-height: 1.15; font-weight: 800; letter-spacing: -0.01em;
  }
  .shot { flex: 1; min-height: 0; display: flex; justify-content: center; align-items: flex-start; }
  img {
    max-width: 100%; max-height: 100%;
    border: calc({{width}}px * 0.012) solid {{accent}}; border-radius: calc({{width}}px * 0.07);
    box-shadow: 0 calc({{width}}px * 0.02) calc({{width}}px * 0.06) rgba(0, 0, 0, 0.35);
  }
</style>
</head>
<body>
  <h1>{{caption}}</h1>
  <div class="shot"><img src="{{screenshot}}" alt=""></div>
</body>
</html>
